<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Text layout mode fallback behavior</title>
  <desc id="desc">Source anchored applies without reflow. Reflow when supported recomposes when possible or falls back to source anchored with a warning. Require reflow recomposes when possible or leaves the target unchanged with an error.</desc>
  <style>
    .bg{fill:#111318}.box{fill:#1b1f27;stroke:#485161;stroke-width:2}.start{fill:#2b313d;stroke:#ff7a1a}.ok{fill:#183b2a;stroke:#43b581}.warn{fill:#493519;stroke:#f0a43c}.fail{fill:#472326;stroke:#db5a62}.title{fill:#f5f7fa;font:700 25px system-ui,sans-serif}.head{fill:#ff7a1a;font:700 17px system-ui,sans-serif}.text{fill:#eef1f5;font:16px system-ui,sans-serif}.small{fill:#cbd1db;font:14px system-ui,sans-serif}.line{stroke:#8993a3;stroke-width:3;fill:none}.yes{fill:#43b581;font:700 14px system-ui,sans-serif}.no{fill:#db5a62;font:700 14px system-ui,sans-serif}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8993a3"/></marker></defs>
  <rect class="bg" width="1200" height="470" rx="18"/>
  <text class="title" x="55" y="52">What happens when reflow is unavailable?</text>

  <text class="head" x="55" y="105">sourceAnchored()</text>
  <rect class="box start" x="55" y="125" width="245" height="72" rx="10"/><text class="text" x="82" y="156">Apply at source anchor</text><text class="small" x="82" y="179">No reflow attempt</text>
  <path class="line" d="M300 161H420" marker-end="url(#arrow)"/>
  <rect class="box ok" x="430" y="125" width="280" height="72" rx="10"/><text class="text" x="458" y="156">Edit applied</text><text class="small" x="458" y="179">Following glyphs stay fixed</text>

  <text class="head" x="55" y="250">reflowWhenSupported(profile)</text>
  <rect class="box start" x="55" y="270" width="245" height="72" rx="10"/><text class="text" x="82" y="301">Attempt reflow</text><text class="small" x="82" y="324">Fallback is permitted</text>
  <path class="line" d="M300 306H420V357H535" marker-end="url(#arrow)"/><text class="yes" x="365" y="279">AVAILABLE</text>
  <rect class="box ok" x="545" y="221" width="280" height="72" rx="10"/><text class="text" x="573" y="252">Edit recomposed</text><text class="small" x="573" y="275">Applied mode reports reflow</text>
  <path class="line" d="M300 306H420V355H535" marker-end="url(#arrow)"/><text class="no" x="360" y="349">UNAVAILABLE</text>
  <rect class="box warn" x="545" y="319" width="280" height="72" rx="10"/><text class="text" x="573" y="350">Source-anchored fallback</text><text class="small" x="573" y="373">Edit applied + warning</text>

  <text class="head" x="855" y="105">requireReflow(profile)</text>
  <rect class="box start" x="855" y="125" width="290" height="72" rx="10"/><text class="text" x="883" y="156">Attempt reflow</text><text class="small" x="883" y="179">Fallback is forbidden</text>
  <path class="line" d="M1000 197V342" marker-end="url(#arrow)"/><text class="yes" x="1014" y="225">AVAILABLE</text>
  <rect class="box ok" x="855" y="252" width="290" height="72" rx="10"/><text class="text" x="883" y="283">Edit recomposed</text><text class="small" x="883" y="306">Applied mode reports reflow</text>
  <path class="line" d="M1000 324V369" marker-end="url(#arrow)"/><text class="no" x="1014" y="352">UNAVAILABLE</text>
  <rect class="box fail" x="855" y="379" width="290" height="72" rx="10"/><text class="text" x="883" y="410">Target left unchanged</text><text class="small" x="883" y="433">Error reports text-reflow</text>
</svg>
