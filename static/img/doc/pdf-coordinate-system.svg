<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">PDF page coordinate system</title>
  <description id="description">A PDF page with its origin at the bottom-left, positive x to the right, positive y upward, and a positioned rectangle described by x, y, width, and height.</description>
  <rect width="1000" height="560" rx="24" fill="#111217"/>
  <rect x="390" y="70" width="390" height="410" rx="5" fill="#fff" stroke="#a7a9b2" stroke-width="4"/>
  <line x1="390" y1="480" x2="865" y2="480" stroke="#ff9d00" stroke-width="6"/>
  <polygon points="865,480 840,468 840,492" fill="#ff9d00"/>
  <line x1="390" y1="480" x2="390" y2="40" stroke="#ff9d00" stroke-width="6"/>
  <polygon points="390,40 378,65 402,65" fill="#ff9d00"/>
  <circle cx="390" cy="480" r="9" fill="#ff9d00"/>
  <text x="344" y="520" fill="#ffcf7c" font-family="JetBrains Mono, monospace" font-size="20">(0, 0)</text>
  <text x="874" y="487" fill="#ffcf7c" font-family="JetBrains Mono, monospace" font-size="20">+x</text>
  <text x="358" y="52" fill="#ffcf7c" font-family="JetBrains Mono, monospace" font-size="20">+y</text>
  <rect x="535" y="235" width="165" height="105" fill="#ff9d0022" stroke="#ff9d00" stroke-width="4"/>
  <circle cx="535" cy="340" r="7" fill="#ff9d00"/>
  <text x="445" y="365" fill="#1a1b20" font-family="JetBrains Mono, monospace" font-size="18">(x, y)</text>
  <line x1="535" y1="360" x2="700" y2="360" stroke="#565a67" stroke-width="3"/>
  <text x="595" y="386" fill="#343641" font-family="JetBrains Mono, monospace" font-size="17">width</text>
  <line x1="720" y1="235" x2="720" y2="340" stroke="#565a67" stroke-width="3"/>
  <text x="735" y="293" fill="#343641" font-family="JetBrains Mono, monospace" font-size="17">height</text>
  <text x="55" y="135" fill="#f4f4f6" font-family="Sora, sans-serif" font-size="27" font-weight="700">PDF coordinates</text>
  <text x="55" y="180" fill="#b9bbc4" font-family="Sora, sans-serif" font-size="19">• units are points</text>
  <text x="55" y="215" fill="#b9bbc4" font-family="Sora, sans-serif" font-size="19">• 72 points = 1 inch</text>
  <text x="55" y="250" fill="#b9bbc4" font-family="Sora, sans-serif" font-size="19">• page numbers start at 1</text>
  <text x="55" y="330" fill="#ffcf7c" font-family="JetBrains Mono, monospace" font-size="18">(x, y) = lower-left corner</text>
  <text x="55" y="362" fill="#b9bbc4" font-family="Sora, sans-serif" font-size="17">of the positioned rectangle</text>
</svg>
