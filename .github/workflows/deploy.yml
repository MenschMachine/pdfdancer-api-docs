name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout v3 Java SDK at pinned version
        run: |
          set -euo pipefail

          V3_SDK_VERSIONS=docs/sdk-versions.md
          V3_JAVA_COMMIT=$(node scripts/sdk-metadata.js "$V3_SDK_VERSIONS" java commit)
          test -n "$V3_JAVA_COMMIT"
          mkdir -p external-v3/pdfdancer-client-java
          curl -sL "https://github.com/MenschMachine/pdfdancer-client-java/archive/$V3_JAVA_COMMIT.tar.gz" \
            | tar xz --strip-components=1 -C external-v3/pdfdancer-client-java
          chmod +x external-v3/pdfdancer-client-java/gradlew

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - name: Test v3 documentation examples
        run: npm run test:docs:v3
      - run: npm run build
      - name: Verify versioned routes and search indexes
        run: npm run test:versioning

      - name: Deploy search indexes to Cloudflare KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: npx dcs deploy

      - name: Upload markdown content to Cloudflare KV
        if: false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail

          content_dir=$(mktemp -d)
          trap 'rm -rf "$content_dir"' EXIT
          node scripts/prepare-search-content.js "$content_dir"
          npx dcs upload-content --content-dir "$content_dir"
