name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout SDK repos at pinned versions
        run: |
          set -euo pipefail

          V1_SDK_VERSIONS=versioned_docs/version-1/sdk-versions.md
          PYTHON_COMMIT=$(grep -A5 '## Python SDK' "$V1_SDK_VERSIONS" | grep '\*\*Commit\*\*' | sed 's/.*`\([^`]*\)`.*/\1/')
          TS_COMMIT=$(grep -A5 '## TypeScript SDK' "$V1_SDK_VERSIONS" | grep '\*\*Commit\*\*' | sed 's/.*`\([^`]*\)`.*/\1/')
          JAVA_COMMIT=$(grep -A5 '## Java SDK' "$V1_SDK_VERSIONS" | grep '\*\*Commit\*\*' | sed 's/.*`\([^`]*\)`.*/\1/')

          for var_name in PYTHON_COMMIT TS_COMMIT JAVA_COMMIT; do
            val="${!var_name}"
            if [ -z "$val" ]; then
              echo "::error::Failed to parse $var_name from $V1_SDK_VERSIONS"
              exit 1
            fi
          done

          echo "Python commit: $PYTHON_COMMIT"
          echo "TypeScript commit: $TS_COMMIT"
          echo "Java commit: $JAVA_COMMIT"

          mkdir -p external

          for repo_info in \
            "pdfdancer-client-python $PYTHON_COMMIT" \
            "pdfdancer-client-typescript $TS_COMMIT" \
            "pdfdancer-client-java $JAVA_COMMIT"; do
            repo=$(echo "$repo_info" | cut -d' ' -f1)
            commit=$(echo "$repo_info" | cut -d' ' -f2)
            mkdir -p "external/${repo}"
            curl -sL "https://github.com/MenschMachine/${repo}/archive/${commit}.tar.gz" \
              | tar xz --strip-components=1 -C "external/${repo}"
          done

          chmod +x external/pdfdancer-client-java/gradlew

          . scripts/docs-v3-sdk-commits.env
          V3_PYTHON_COMMIT="$PYTHON_COMMIT"
          V3_TS_COMMIT="$TYPESCRIPT_COMMIT"
          V3_JAVA_COMMIT="$JAVA_COMMIT"
          for repo_info in \
            "pdfdancer-client-python $V3_PYTHON_COMMIT" \
            "pdfdancer-client-typescript $V3_TS_COMMIT" \
            "pdfdancer-client-java $V3_JAVA_COMMIT"; do
            repo=$(echo "$repo_info" | cut -d' ' -f1)
            commit=$(echo "$repo_info" | cut -d' ' -f2)
            test -n "$commit"
            mkdir -p "external-v3/$repo"
            curl -sL "https://github.com/MenschMachine/$repo/archive/$commit.tar.gz" \
              | tar xz --strip-components=1 -C "external-v3/$repo"
          done
          chmod +x external-v3/pdfdancer-client-java/gradlew

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - name: Build pinned v1 TypeScript SDK
        run: |
          npm ci --ignore-scripts --prefix external/pdfdancer-client-typescript
          npm run build --prefix external/pdfdancer-client-typescript
      - name: Build pinned v3 TypeScript SDK
        run: |
          npm ci --ignore-scripts --prefix external-v3/pdfdancer-client-typescript
          npm run build --prefix external-v3/pdfdancer-client-typescript
      - name: Install pinned v1 Python SDK and test dependencies
        run: pip install mktestdocs pytest ./external/pdfdancer-client-python
      - name: Test documentation examples
        env:
          PDFDANCER_TYPESCRIPT_SDK_DIR: external/pdfdancer-client-typescript
        run: npm run test:docs:v1
      - name: Install pinned v3 Python SDK and test documentation examples
        env:
          PDFDANCER_TYPESCRIPT_SDK_DIR: external-v3/pdfdancer-client-typescript
          PDFDANCER_JAVA_SDK_DIR: external-v3/pdfdancer-client-java
        run: |
          pip install --force-reinstall ./external-v3/pdfdancer-client-python
          npm run test:docs:v3
      - run: npm run build
      - name: Verify versioned routes and search indexes
        run: npm run test:versioning

      - name: Deploy search indexes to Cloudflare KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: npx dcs deploy

      # Disabled until a version-specific raw Markdown upload policy is defined.
      - name: Upload markdown content to Cloudflare KV
        if: ${{ false }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: npx dcs upload-content
