name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout SDK repos at pinned versions
        run: |
          set -euo pipefail

          V1_SDK_VERSIONS=versioned_docs/version-1/sdk-versions.md
          V3_SDK_VERSIONS=docs/sdk-versions.md
          JAVA_COMMIT=$(node scripts/sdk-metadata.js "$V1_SDK_VERSIONS" java commit)

          for var_name in JAVA_COMMIT; do
            val="${!var_name}"
            if [ -z "$val" ]; then
              echo "::error::Failed to parse $var_name from $V1_SDK_VERSIONS"
              exit 1
            fi
          done

          echo "Java commit: $JAVA_COMMIT"

          mkdir -p external

          for repo_info in \
            "pdfdancer-client-java $JAVA_COMMIT"; do
            repo=$(echo "$repo_info" | cut -d' ' -f1)
            commit=$(echo "$repo_info" | cut -d' ' -f2)
            mkdir -p "external/${repo}"
            curl -sL "https://github.com/MenschMachine/${repo}/archive/${commit}.tar.gz" \
              | tar xz --strip-components=1 -C "external/${repo}"
          done

          chmod +x external/pdfdancer-client-java/gradlew

          V3_JAVA_COMMIT=$(node scripts/sdk-metadata.js "$V3_SDK_VERSIONS" java commit)
          for repo_info in \
            "pdfdancer-client-java $V3_JAVA_COMMIT"; do
            repo=$(echo "$repo_info" | cut -d' ' -f1)
            commit=$(echo "$repo_info" | cut -d' ' -f2)
            test -n "$commit"
            mkdir -p "external-v3/$repo"
            curl -sL "https://github.com/MenschMachine/$repo/archive/$commit.tar.gz" \
              | tar xz --strip-components=1 -C "external-v3/$repo"
          done
          chmod +x external-v3/pdfdancer-client-java/gradlew

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - run: npm ci
      - name: Test documentation examples
        run: npm run test:docs:v1
      - name: Test v3 documentation examples
        run: npm run test:docs:v3
      - run: npm run build
      - name: Verify versioned routes and search indexes
        run: npm run test:versioning

      - name: Deploy search indexes to Cloudflare KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail

          v1_index_dir=$(mktemp -d)
          trap 'rm -rf "$v1_index_dir"' EXIT
          test -f build/search-index-docs-default-1.json
          cp build/search-index-docs-default-1.json "$v1_index_dir/"
          npx dcs deploy --dir "$v1_index_dir"

      - name: Upload markdown content to Cloudflare KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: npx dcs upload-content --content-dir versioned_docs/version-1
