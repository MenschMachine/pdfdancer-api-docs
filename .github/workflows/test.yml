name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout v1 and v3 SDK repos at pinned versions
        run: |
          set -euo pipefail

          checkout_set() {
            version="$1"
            versions_file="$2"
            java_commit=$(node scripts/sdk-metadata.js "$versions_file" java commit)
            for repo_info in \
              "pdfdancer-client-java $java_commit"; do
              repo=$(echo "$repo_info" | cut -d' ' -f1)
              commit=$(echo "$repo_info" | cut -d' ' -f2)
              test -n "$commit"
              mkdir -p "external/$version/$repo"
              curl -sL "https://github.com/MenschMachine/$repo/archive/$commit.tar.gz" \
                | tar xz --strip-components=1 -C "external/$version/$repo"
            done
            chmod +x "external/$version/pdfdancer-client-java/gradlew"
          }

          checkout_set v1 versioned_docs/version-1/sdk-versions.md
          checkout_set v3 docs/sdk-versions.md

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install Node dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Test API v1 documentation examples
        run: npm run test:docs:v1

      - name: Test API v3 documentation examples
        run: npm run test:docs:v3

      - name: Check generated API v3 reference
        env:
          PDFDANCER_JAVA_SDK_DIR: external/v3/pdfdancer-client-java
        run: npm run test:v3-reference
