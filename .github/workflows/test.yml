name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout v1 and v2 SDK repos at pinned versions
        run: |
          set -euo pipefail

          checkout_set() {
            version="$1"
            versions_file="$2"
            if [ "$version" = v2 ]; then
              . scripts/docs-v2-sdk-commits.env
              python_commit="$PYTHON_COMMIT"
              ts_commit="$TYPESCRIPT_COMMIT"
              java_commit="$JAVA_COMMIT"
            else
              python_commit=$(grep -A7 '## Python SDK' "$versions_file" | grep '\*\*Commit\*\*' | sed 's/.*`\([^`]*\)`.*/\1/')
              ts_commit=$(grep -A7 '## TypeScript SDK' "$versions_file" | grep '\*\*Commit\*\*' | sed 's/.*`\([^`]*\)`.*/\1/')
              java_commit=$(grep -A7 '## Java SDK' "$versions_file" | grep '\*\*Commit\*\*' | sed 's/.*`\([^`]*\)`.*/\1/')
            fi
            for repo_info in \
              "pdfdancer-client-python $python_commit" \
              "pdfdancer-client-typescript $ts_commit" \
              "pdfdancer-client-java $java_commit"; do
              repo=$(echo "$repo_info" | cut -d' ' -f1)
              commit=$(echo "$repo_info" | cut -d' ' -f2)
              test -n "$commit"
              mkdir -p "external/$version/$repo"
              curl -sL "https://github.com/MenschMachine/$repo/archive/$commit.tar.gz" \
                | tar xz --strip-components=1 -C "external/$version/$repo"
            done
            chmod +x "external/$version/pdfdancer-client-java/gradlew"
          }

          checkout_set v1 versioned_docs/version-1/sdk-versions.md
          checkout_set v2 docs/sdk-versions.md

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node dependencies
        run: npm ci

      - name: Install documentation test dependencies
        run: pip install mktestdocs pytest

      - name: Run typecheck
        run: npm run typecheck

      - name: Build pinned TypeScript SDKs
        run: |
          npm ci --ignore-scripts --prefix external/v1/pdfdancer-client-typescript
          npm run build --prefix external/v1/pdfdancer-client-typescript
          npm ci --ignore-scripts --prefix external/v2/pdfdancer-client-typescript
          npm run build --prefix external/v2/pdfdancer-client-typescript

      - name: Test API v1 documentation examples
        env:
          PDFDANCER_TYPESCRIPT_SDK_DIR: external/v1/pdfdancer-client-typescript
          PDFDANCER_JAVA_SDK_DIR: external/v1/pdfdancer-client-java
        run: |
          pip install --force-reinstall ./external/v1/pdfdancer-client-python
          npm run test:docs:v1

      - name: Test API v2 documentation examples
        env:
          PDFDANCER_TYPESCRIPT_SDK_DIR: external/v2/pdfdancer-client-typescript
          PDFDANCER_JAVA_SDK_DIR: external/v2/pdfdancer-client-java
        run: |
          pip install --force-reinstall ./external/v2/pdfdancer-client-python
          npm run test:docs:v2

      - name: Check generated API v2 reference
        env:
          PDFDANCER_JAVA_SDK_DIR: external/v2/pdfdancer-client-java
        run: npm run test:v2-reference
